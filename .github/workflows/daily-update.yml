name: Daily Odds Update

on:
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC daily
  workflow_dispatch: {}   # lets you click "Run workflow" to test manually

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Fetch odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: npm run fetch

      - name: Fetch Win/Draw predictions
        env:
          RAPIDAPI_FOOTBALL_PREDICTION_KEY: ${{ secrets.RAPIDAPI_FOOTBALL_PREDICTION_KEY }}
        run: npm run fetch:1x2
        continue-on-error: true # separate key/quota — don't fail the whole run if this one isn't set up yet

      - name: Fetch NFL moneyline
        env:
          RAPIDAPI_FOOTBALL_PREDICTION_KEY: ${{ secrets.RAPIDAPI_FOOTBALL_PREDICTION_KEY }}
        run: npm run fetch:nfl
        continue-on-error: true # same RapidAPI account key, separate per-API subscription/quota

      - name: Fetch MLB moneyline
        env:
          RAPIDAPI_FOOTBALL_PREDICTION_KEY: ${{ secrets.RAPIDAPI_FOOTBALL_PREDICTION_KEY }}
        run: npm run fetch:mlb
        continue-on-error: true # same RapidAPI account key, separate per-API subscription/quota

      - name: Fetch team badges
        run: npm run fetch:badges
        continue-on-error: true # cache-backed and rate-limited on its own; never block the rest of the run

      - name: Commit updated picks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/picks.json data/win-draw.json data/nfl.json data/mlb.json data/team-badges.json
          git diff --staged --quiet && echo "No changes to commit." || git commit -m "Update picks $(date -u +%Y-%m-%d)"
          git push
